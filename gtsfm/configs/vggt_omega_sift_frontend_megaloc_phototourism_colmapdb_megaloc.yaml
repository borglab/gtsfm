# VGGT-OMEGA + VERIFIED pipeline, fed by an OFFLINE COLMAP database, with the dense COLMAP view graph
# SPARSIFIED by MegaLoc similarity. Identical to vggt_omega_sift_frontend_megaloc_phototourism_colmapdb.yaml
# EXCEPT the retriever: COLMAP's vocab-tree matching is dense (~140k verified pairs on St Peter's -> a huge
# Metis cluster tree). ColmapDBMegaLoc keeps only the pairs that are BOTH COLMAP-verified AND in MegaLoc's
# per-image top-K (num_matched/min_score) — a strict intersection that sparsifies the view graph while
# still reading correspondences from the db for the surviving pairs. Everything downstream is unchanged.
# db path defaults to <loader.dataset_dir>/database.db; override the two database_path keys to point
# elsewhere (e.g. a node-local copy). Build the db with scripts/build_colmap_db.sh.

# @package _global_
_target_: gtsfm.scene_optimizer.SceneOptimizer

loader:
  _target_: gtsfm.loader.Olsson
  dataset_dir: ??? # Required: set to the dataset root on the command line (must contain database.db + images).
  images_dir: null
  max_resolution: 518 # VGGT recommended max resolution.

image_pairs_generator:
  _target_: gtsfm.retriever.image_pairs_generator.ImagePairsGenerator
  # MegaLoc similarity is (re)enabled here purely to SPARSIFY the COLMAP view graph. The hybrid retriever
  # keeps each image's top-`num_matched` COLMAP-verified neighbors RANKED by MegaLoc similarity (not a
  # strict intersection — that collapsed to a fragmented graph). min_score=0.0 = rank-only (COLMAP already
  # gates geometric quality). correspondences still come from the db.
  global_descriptor:
    _target_: gtsfm.frontend.cacher.global_descriptor_cacher.GlobalDescriptorCacher
    global_descriptor_obj:
      _target_: gtsfm.frontend.global_descriptor.MegaLoc
  retriever:
    _target_: gtsfm.retriever.ColmapDBMegaLoc
    database_path: ${loader.dataset_dir}/database.db
    num_matched: 20
    min_score: 0.0
  batch_size: 16

graph_partitioner:
  _target_: gtsfm.graph_partitioner.Metis
  min_cameras_to_partition: 30
  max_cameras: 70
  split_oversized_nodes: true

cluster_optimizer:
  _target_: gtsfm.cluster_optimizer.Cacher
  optimizer:
    _target_: gtsfm.cluster_optimizer.VggtWithFrontend

    # COLMAP-DB frontend: reads keypoints + ALREADY-VERIFIED inlier matches from the database (rescaled to
    # the loader resolution). Marked produces_verified_correspondences=True, so the verified pipeline reads
    # it directly and skips the Dask two-view estimation + gather.
    correspondence_generator:
      _target_: gtsfm.frontend.correspondence_generator.colmap_correspondence_generator.ColmapCorrespondenceGenerator
      database_path: ${loader.dataset_dir}/database.db

    # Unused on the db path (the bypass skips two-view estimation; clusters reuse global correspondences),
    # but kept so the optimizer instantiates with a valid verifier.
    two_view_estimator:
      _target_: gtsfm.two_view_estimator_cacher.TwoViewEstimatorCacher
      two_view_estimator_obj:
        _target_: gtsfm.two_view_estimator.TwoViewEstimator
        bundle_adjust_2view: True
        eval_threshold_px: 4
        ba_reproj_error_thresholds: [0.5]
        bundle_adjust_2view_maxiters: 100
        verifier:
          _target_: gtsfm.frontend.verifier.poselib_verifier.PoseLibVerifier
          estimation_threshold_px: 2
        triangulation_options:
          _target_: gtsfm.data_association.point3d_initializer.TriangulationOptions
          reproj_error_threshold: 100.0
          mode:
            _target_: gtsfm.data_association.point3d_initializer.TriangulationSamplingMode
            value: NO_RANSAC
        inlier_support_processor:
          _target_: gtsfm.two_view_estimator.InlierSupportProcessor
          min_num_inliers_est_model: 30
          min_inlier_ratio_est_model: 0.15

    # --- VGGT-Omega geometry (peak). Same as the omega verified config. ---
    geometry_transformer:
      _target_: gtsfm.frontend.vggt_omega_geometry_transformer.VggtOmegaGeometryTransformer

    ba_options:
      _target_: gtsfm.bundle.bundle_adjustment.BundleAdjustmentOptions
      shared_calib: false
      use_calibration_prior: true
      calibration_prior_focal_sigma: 5.0
      use_gnc: true
      gnc_loss: TLS
      factor_weight_outlier_threshold: 1e-6

    pre_ba_max_reproj_error: 14.0
    post_ba_max_reproj_error: 3.0
    drop_camera_with_no_track: false
    min_track_length: 3
    input_mode: crop
    seed: 42
    model_cache_key: false  # forces the omega transformer to self-load (never the vanilla VGGT loader)
    use_view_graph_calibration: true
    use_global_view_graph_calibration: true
    use_multi_view_retriangulation: false
    use_triangulated_structure: false
    # Reuse the global (db) verified correspondences per cluster — required so clusters don't re-run a
    # frontend. The colmap-db path makes this the only consumer of the correspondences.
    reuse_global_correspondences: true

# --- Merging options (identical to the omega verified config) ---
merging_options:
  _target_: gtsfm.cluster_merging.MergingOptions
  run_bundle_adjustment: true
  merge_duplicate_tracks: true
  drop_child_if_merging_fail: true
  drop_outlier_after_camera_merging: true
  drop_camera_with_no_track: false
  keep_all_cameras: false
  plot_reprojection_histograms: true
  use_nonlinear_sim3_alignment: true
  max_track_correspondences_for_sim3: 150
  scale_and_average_focal_length: false
  pre_ba_max_reproj_error: 14.0
  pre_ba_min_track_length: 3
  post_ba_max_reproj_error: 3.0
  min_track_length: 3
  allow_post_ba_reproj_filtering: true
  metric_constructed_only: true
  recover_trackless_cameras_in_retriangulation: true
  ba_options:
    _target_: gtsfm.bundle.bundle_adjustment.BundleAdjustmentOptions
    shared_calib: false
    use_calibration_prior: true
    calibration_prior_focal_sigma: 10.0
    use_pose_prior_all_cameras: true
    use_gnc: false
    gnc_loss: TLS
    factor_weight_outlier_threshold: 1e-6

# --- Bridge params ---
bridge_min_similarity: 0.0
bridge_top_k: 10
bridge_min_component_size: 3

# --- Verified-viewgraph pipeline ---
use_verified_pipeline: true
