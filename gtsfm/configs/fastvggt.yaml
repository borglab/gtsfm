# FastVGGT cluster-only configuration.

# @package _global_
_target_: gtsfm.scene_optimizer.SceneOptimizer

loader:
  _target_: gtsfm.loader.Olsson
  dataset_dir: ??? # Required: set to the dataset root on the command line.
  images_dir: null
  max_resolution: 518 # VGGT recommended max resolution. Non editable. mode is fixed to "crop"

image_pairs_generator:
  _target_: gtsfm.retriever.image_pairs_generator.ImagePairsGenerator
  global_descriptor:
    _target_: gtsfm.frontend.cacher.global_descriptor_cacher.GlobalDescriptorCacher
    global_descriptor_obj:
      _target_: gtsfm.frontend.global_descriptor.MegaLoc
  retriever:
    _target_: gtsfm.retriever.Similarity
    num_matched: 5
    min_score: 0.79
  batch_size: 16

graph_partitioner:
  _target_: gtsfm.graph_partitioner.Single

cluster_optimizer:
  _target_: gtsfm.cluster_optimizer.cluster_fast_vggt.ClusterFastVGGT

  # --- Geometry transformer (built from FastVGGT params below) ---
  fast_dtype: bfloat16
  merging: 0  # Set >0 to enable FastVGGT token merging.
  vis_attn_map: false
  enable_protection: false
  extra_model_kwargs: {}

  # --- Multi-view tracker ---
  tracker:
    _target_: gtsfm.frontend.multi_view_tracker.MultiViewTracker
    config:
      _target_: gtsfm.frontend.multi_view_tracker.TrackingConfig
      tracking: true
      max_query_pts: 2048
      query_frame_num: 3
      keypoint_extractor: aliked+sp+sift
      track_vis_thresh: 0.05
      track_conf_thresh: 0.2
      vggt_max_reproj_error: 0.0 # 0.0 means no filtering based on reproj error
      min_triangulation_angle: 0.0
      ba_use_undistorted_camera_model: false

  # --- VGGT operational params ---
  weights_path: null
  seed: 42
  model_cache_key: null

# --- Merging options ---
merging_options:
  _target_: gtsfm.cluster_merging.MergingOptions
  run_bundle_adjustment: false
  merge_duplicate_tracks: false
  drop_child_if_merging_fail: true
  drop_outlier_after_camera_merging: false
  drop_camera_with_no_track: true
  keep_all_cameras: false
  plot_reprojection_histograms: true
  ba_options:
    _target_: gtsfm.bundle.bundle_adjustment.BundleAdjustmentOptions
    shared_calib: true
    use_calibration_prior: false
