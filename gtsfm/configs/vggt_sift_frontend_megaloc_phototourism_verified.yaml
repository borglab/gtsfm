# VGGT-with-frontend configuration (VERIFIED-VIEWGRAPH pipeline; A/B treatment arm).
# Identical to vggt_sift_frontend_megaloc_phototourism.yaml, plus use_verified_pipeline: true, which:
#   (a) runs a global two-view verification pass over the full MegaLoc retrieval graph and partitions
#       METIS on the VERIFIED subgraph (edges where TwoViewResult.valid()), and
#   (b) retriangulates the SIFT-verified multiview tracks against the merged VGGT poses + BA after the
#       hierarchical merge (structure refinement), written to results/merged_retriangulated/.
# Baseline arm = vggt_sift_frontend_megaloc_phototourism.yaml (flag defaults to false).

# @package _global_
_target_: gtsfm.scene_optimizer.SceneOptimizer

loader:
  _target_: gtsfm.loader.Olsson
  dataset_dir: ??? # Required: set to the dataset root on the command line.
  images_dir: null
  max_resolution: 518 # VGGT recommended max resolution.

image_pairs_generator:
  _target_: gtsfm.retriever.image_pairs_generator.ImagePairsGenerator
  global_descriptor:
    _target_: gtsfm.frontend.cacher.global_descriptor_cacher.GlobalDescriptorCacher
    global_descriptor_obj:
      _target_: gtsfm.frontend.global_descriptor.MegaLoc
  retriever:
    _target_: gtsfm.retriever.Similarity
    num_matched: 100
    min_score: 0.15
  batch_size: 16

graph_partitioner:
  _target_: gtsfm.graph_partitioner.Metis
  min_cameras_to_partition: 30
  max_cameras: 70
  split_oversized_nodes: true

cluster_optimizer:
  _target_: gtsfm.cluster_optimizer.Cacher
  optimizer:
    _target_: gtsfm.cluster_optimizer.VggtWithFrontend

    correspondence_generator:
      _target_: gtsfm.frontend.correspondence_generator.det_desc_correspondence_generator.DetDescCorrespondenceGenerator
      detector_descriptor:
        _target_: gtsfm.frontend.cacher.detector_descriptor_cacher.DetectorDescriptorCacher
        detector_descriptor_obj:
          _target_: gtsfm.frontend.detector_descriptor.colmap_sift.ColmapSIFTDetectorDescriptor
          max_keypoints: 8192

      matcher:
        _target_: gtsfm.frontend.cacher.matcher_cacher.MatcherCacher
        matcher_obj:
          _target_: gtsfm.frontend.matcher.twoway_matcher.TwoWayMatcher
          ratio_test_threshold: 0.8

    two_view_estimator:
      _target_: gtsfm.two_view_estimator_cacher.TwoViewEstimatorCacher
      two_view_estimator_obj:
        _target_: gtsfm.two_view_estimator.TwoViewEstimator
        bundle_adjust_2view: True
        eval_threshold_px: 4 # in px
        ba_reproj_error_thresholds: [0.5]
        bundle_adjust_2view_maxiters: 100

        verifier:
          # PoseLib 5-point + LO-RANSAC + 2-view bundle (gp-glomap-parity peak verifier).
          _target_: gtsfm.frontend.verifier.poselib_verifier.PoseLibVerifier
          estimation_threshold_px: 2

        triangulation_options:
          _target_: gtsfm.data_association.point3d_initializer.TriangulationOptions
          reproj_error_threshold: 100.0
          mode:
            _target_: gtsfm.data_association.point3d_initializer.TriangulationSamplingMode
            value: NO_RANSAC

        inlier_support_processor:
          _target_: gtsfm.two_view_estimator.InlierSupportProcessor
          min_num_inliers_est_model: 30
          min_inlier_ratio_est_model: 0.15

    geometry_transformer:
      _target_: gtsfm.frontend.vggt_geometry_transformer.VggtGeometryTransformer
      config:
        _target_: gtsfm.frontend.vggt_geometry_transformer.VggtGeometryConfig
        confidence_threshold: 0.1
        max_num_points: 100000
        seed: 42

    ba_options:
      _target_: gtsfm.bundle.bundle_adjustment.BundleAdjustmentOptions
      shared_calib: false
      # Anchor each focal at its (global-)Fetzer value so the per-cluster BA optimizes POSES, not focals.
      # Without this, each cluster's BA drifts the same camera's focal differently (focal/depth ambiguity),
      # so parent and child versions of a separator camera diverge -> noisier Sim3 merge. Pinned tighter
      # (5px) than the merge BA (10px) since focals should stay at Fetzer upstream.
      use_calibration_prior: true
      calibration_prior_focal_sigma: 5.0
      use_gnc: true
      gnc_loss: TLS
      factor_weight_outlier_threshold: 1e-6

    pre_ba_max_reproj_error: 14.0
    post_ba_max_reproj_error: 3.0
    drop_camera_with_no_track: false
    min_track_length: 3
    input_mode: crop
    seed: 42
    model_cache_key: null
    # Refine VGGT predicted intrinsics via scipy Fetzer focal optimization on the verified F-matrices.
    use_view_graph_calibration: true
    # Estimate focals with a single GLOBAL Fetzer over the full verified view graph (never falls back to
    # VGGT focals like the per-cluster path does). Takes precedence over use_view_graph_calibration.
    use_global_view_graph_calibration: true
    # Re-triangulate union-find 2D tracks against post-BA cameras and run another BA.
    use_multi_view_retriangulation: false
    # Per-cluster 3D init: false = lift per-pixel VGGT predicted depth (Akshay's original, the known-good
    # 219-cam / AUC@3 0.675 baseline). The triangulated-structure path (true) inflated clusters to 11k-15k
    # tracks → 85-200s BAs → worker OOM / dask FutureCancelledError, with no proven gain over 219. Reverted
    # to VGGT depth; the focal-flow fix (global Fetzer + calibration priors) still applies on this path.
    use_triangulated_structure: false
    # Reuse the global verified correspondences (computed once over the full verified view graph) to build
    # each cluster's 2D tracks, instead of re-running the per-cluster correspondence generation + two-view
    # estimation (which only cache-reads the same data, serially + redundantly across overlapping clusters).
    # Pure speedup: per-edge v_corr is identical. Requires use_verified_pipeline.
    reuse_global_correspondences: true

# --- Merging options ---
merging_options:
  _target_: gtsfm.cluster_merging.MergingOptions
  run_bundle_adjustment: true
  merge_duplicate_tracks: true
  drop_child_if_merging_fail: true
  drop_outlier_after_camera_merging: true
  drop_camera_with_no_track: false
  keep_all_cameras: false
  plot_reprojection_histograms: true
  use_nonlinear_sim3_alignment: true
  max_track_correspondences_for_sim3: 150
  scale_and_average_focal_length: false
  pre_ba_max_reproj_error: 14.0
  pre_ba_min_track_length: 3
  post_ba_max_reproj_error: 3.0
  min_track_length: 3
  allow_post_ba_reproj_filtering: true
  metric_constructed_only: true
  # Recover good-pose / no-VGGT-depth cameras (left track-less at construction, e.g. Brussels 104/207)
  # by injecting their merged poses into the post-merge retriangulation, which geometrically re-triangulates
  # their global 2D tracks (depth-confidence independent). Cameras that still fail to triangulate are
  # cleanly dropped. Orthogonal to the per-cluster depth gate; the constructed 229 are untouched.
  recover_trackless_cameras_in_retriangulation: true
  ba_options:
    _target_: gtsfm.bundle.bundle_adjustment.BundleAdjustmentOptions
    shared_calib: false
    # Anchor focals at their (good) per-cluster-BA / Fetzer values so the merge + post-merge-retri BA
    # optimize POSES, not focals. Without this the free-focal BA distorts good focals (0.9-2.4% -> up to
    # 100% err vs GLOMAP) to absorb Sim3 pose error, inflating reproj and dropping cameras at the 3px filter.
    use_calibration_prior: true
    calibration_prior_focal_sigma: 10.0
    use_pose_prior_all_cameras: true
    use_gnc: false
    gnc_loss: TLS
    factor_weight_outlier_threshold: 1e-6

# --- Bridge params ---
bridge_min_similarity: 0.0
bridge_top_k: 10
bridge_min_component_size: 3

# --- Verified-viewgraph pipeline (A/B treatment): verified-graph partition + post-merge retriangulation+BA ---
use_verified_pipeline: true
