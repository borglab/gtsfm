name: Publish Modal runtime image

on:
  workflow_dispatch:
  push:
    branches: [master, firstclass]
    tags: ["v*"]
    paths:
      - "docker/modal-runtime.Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/modal-runtime-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: modal-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/borglab/gtsfm-modal-runtime
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/modal-runtime.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
